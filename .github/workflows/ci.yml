name: CI

# One required workflow, in the order section 18 of plan.md specifies:
# lint -> typecheck -> test -> build -> size -> publint + attw.
#
# plan.md section 5 names size-limit for budgets and section 4 requires
# publint AND attw. The budgets are measured by a hand-rolled script instead
# (ADR-010), and the attw profile is esm-only because section 4 mandates
# ESM-only output; both deviations are recorded rather than silent.
#
# `verify` runs the same command locally, so a green local run and a green CI run
# mean the same thing. The steps are split here only so a failure names itself.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_UI: stream

jobs:
  verify:
    name: lint, typecheck, test, build, budgets, packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @santaka-ui/web-components exec playwright install --with-deps chromium

      # Chromium only. `pnpm run verify` runs `playwright test`, which launches
      # every project in the config — including firefox, webkit, and visual — so
      # installing just chromium here made the run fail on a missing Firefox
      # binary. The cross-engine matrix is the `browsers` job's job, and it has
      # its own install step; this one is the fast gate.
      - name: Verify
        run: pnpm run verify
        env:
          PLAYWRIGHT_PROJECT: chromium-baseline

      # The adapter element types are a hand-written copy of the custom elements,
      # and a drifted copy compiles while being wrong. This reads the components
      # and the three adapters, so it cannot live inside `pnpm run verify`: that
      # runs each package's own test script, and this compares across packages.
      # It runs after the build because TypeScript is what would otherwise catch
      # a type disagreement — and it does not, because the copies are independent.
      - name: Declaration drift
        run: pnpm run test:declarations

      - name: Bundle budget report
        if: always()
        run: pnpm run size

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/web-components/playwright-report/
          retention-days: 7

  browsers:
    name: browser matrix (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-baseline, firefox-baseline, webkit-baseline]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @santaka-ui/web-components exec playwright install --with-deps ${{ matrix.project == 'chromium-baseline' && 'chromium' || matrix.project == 'firefox-baseline' && 'firefox' || 'webkit' }}

      - run: pnpm --filter @santaka-ui/web-components exec playwright test --project ${{ matrix.project }}

  react-example:
    name: React example submits through a plain form
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @santaka-ui/example-react-vite exec playwright install --with-deps chromium

      # The workspace packages are consumed through their published `exports`
      # maps, which point into `dist/` — and `dist/` is gitignored, so a fresh
      # checkout has none. Without this build, `vite build` cannot resolve
      # `@santaka-ui/react` at all. The example deliberately carries no
      # `resolve.alias` so it proves the consumer resolution path; that path is
      # the one that needs the build.
      - name: Build the workspace packages
        run: pnpm run build

      # `plan.md` section 17: every form control submits through a plain form in
      # React. The universal half is proven in the web-components suite; this is
      # the React half, and it is a separate job because it is a separate claim —
      # the adapter dropping `name` is invisible to the universal tests.
      - name: Build the example and run its browser tests
        run: pnpm --filter @santaka-ui/example-react-vite test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: react-example-report
          path: examples/react-vite/playwright-report/
          retention-days: 7

  vue-example:
    name: Vue example submits through a plain form
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @santaka-ui/example-vue-vite exec playwright install --with-deps chromium

      # The same reason as the React job: `dist/` is gitignored, and the example
      # deliberately carries no `resolve.alias`, so it needs the workspace build
      # to resolve `@santaka-ui/vue` through its published `exports` map.
      - name: Build the workspace packages
        run: pnpm run build

      # `plan.md` section 17: every form control submits through a plain form in
      # Vue. This is the Vue half, and it is a separate job rather than a second
      # step in the React job because it is a separate claim: Vue chooses between
      # a property and an attribute per component, so a control can take a route
      # React never takes and still be wrong.
      - name: Build the example and run its browser tests
        run: pnpm --filter @santaka-ui/example-vue-vite test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vue-example-report
          path: examples/vue-vite/playwright-report/
          retention-days: 7

  svelte-example:
    name: Svelte server-renders, hydrates clean and submits a form
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @santaka-ui/example-svelte-vite exec playwright install --with-deps chromium

      # The same reason as the React and Vue jobs: `dist/` is gitignored, and the
      # example resolves `@santaka-ui/svelte` and `@santaka-ui/web-components`
      # through their published `exports` maps, so the workspace has to be built.
      - name: Build the workspace packages
        run: pnpm run build

      # Section 3's Svelte gate is props, events, SSR and hydration, and this job
      # exists for the third and fourth: the example serves a real server-rendered
      # page, hydrates it, and the suite checks that hydration *reused* the
      # server's nodes instead of replacing them. Registering the elements before
      # hydration passes every other test in the file and fails only that one,
      # which is why the ordering is asserted rather than described (ADR-021).
      - name: Build the example and run its browser tests
        run: pnpm --filter @santaka-ui/example-svelte-vite test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: svelte-example-report
          path: examples/svelte-vite/playwright-report/
          retention-days: 7

  nextjs-example:
    name: Next.js renders on the server and hydrates clean
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @santaka-ui/example-nextjs exec playwright install --with-deps chromium

      # Same reason as the React example: the packages resolve through `dist/`,
      # which a fresh checkout does not have. `next build` imports
      # `@santaka-ui/react` and `@santaka-ui/web-components` by their exports maps.
      - name: Build the workspace packages
        run: pnpm run build

      # `plan.md` section 3 and risk R2: the server output must carry the custom
      # element tags with their public attributes and must NOT define them, so the
      # tree the server produced is the tree the client hydrates against. The
      # example built and proved this locally but no job ran it, which left the
      # Next.js integration at Preview — a claim nothing defended against
      # regression. `test:ssr` builds the app first, so it is self-contained.
      - name: Build the app and run the SSR proof
        run: pnpm --filter @santaka-ui/example-nextjs test:ssr

  changesets:
    name: changesets are valid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check changeset status
        run: pnpm exec changeset status --since origin/main

  support-matrix:
    name: support matrix is in sync with the Playwright config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The check reads each browser's revision from its executable path, so all
      # three must be installed before it can reproduce the document.
      - run: pnpm --filter @santaka-ui/web-components exec playwright install chromium firefox webkit

      # `plan.md` section 4: adding a browser to the documentation without a test job
      # is a release blocker. This fails when the document and the Playwright
      # projects disagree, which is the only way the two can drift.
      - name: Check the generated support matrix
        run: pnpm --filter @santaka-ui/web-components support-matrix:check

  framework-matrix:
    name: framework support matrix is in sync with the repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # plan.md section 17: "The public framework/browser support matrix reflects
      # tested evidence." The browser half is the job above, derived from the
      # Playwright projects. This is the framework half, and it needs no build:
      # every claim it checks is a directory or a package script, both of which
      # are in the checkout. It fails in both directions — a Stable target whose
      # example is gone, and a Planned target whose package now exists.
      - name: Check the framework matrix against the repository
        run: pnpm run framework-support:check

      # The check above proves the committed document matches the tree; these
      # tests prove the check itself rejects an unbacked claim, which cannot be
      # shown against the real tree because every claim in it is true.
      - name: Framework matrix tests
        run: pnpm run test:docs

  llms:
    name: llms.txt and llms-full.txt are in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `plan.md` section 11: regenerate and verify in CI so the files cannot go
      # stale. The generator reads the registry metadata and the committed
      # components.d.ts, but the token-group counts come from the compiled CSS,
      # so the tokens package is built first.
      - run: pnpm --filter @santaka-ui/tokens build

      - name: Check llms.txt is in sync
        run: pnpm --filter @santaka-ui/core llms:check

  mcp:
    name: MCP server smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @santaka-ui/core build
      - run: pnpm --filter @santaka-ui/tokens build
      - run: pnpm --filter @santaka-ui/mcp build

      # `plan.md` section 11: the server is smoke-tested by launching it and asserting
      # one response shape per tool. The test drives a real MCP client over an
      # in-memory transport pair, so it covers registration, input schemas, and
      # serialization rather than only the tool functions.
      - name: Smoke test every tool
        run: pnpm --filter @santaka-ui/mcp test:smoke

  cli:
    name: CLI end-to-end
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # plan.md section 8 requires CLI behavior tested on Windows, macOS, and Linux.
      # The paths, the exit codes, and the executable bit all differ per platform,
      # and each has been wrong in some CLI at some point.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `turbo run build --filter=…cli...`, not three hand-listed
      # `pnpm --filter` builds: the list has to name every transitive build
      # dependency by hand, and it stopped being complete the moment
      # `web-components` began importing `@santaka-ui/utilities`. The graph is
      # what knows the order, so the graph is what runs here.
      - run: pnpm exec turbo run build --filter=@santaka-ui/cli...

      # The unit tests cover the pieces; the e2e run drives the built binary in a
      # real subprocess against a real temporary project, which is the only way to
      # assert an exit code.
      - name: Unit tests
        run: pnpm --filter @santaka-ui/cli test

      - name: End-to-end
        run: pnpm --filter @santaka-ui/cli test:e2e

  consumer:
    name: consumer fixture (packed tarballs, scratch project)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every package must be built before it is packed, because the tarballs are
      # what the fixture installs.
      - run: pnpm run build

      # One of the thirteen checks loads the elements in a real browser to prove
      # they *upgrade* from the tarball. `pnpm install` fetches the Playwright
      # package but not the browser binary, so the launch fails here: the `verify`
      # job installs the browser, and this job runs the same check without one.
      - name: Install Playwright browser
        run: pnpm --filter @santaka-ui/web-components exec playwright install --with-deps chromium

      # `plan.md` section 17: "Public TypeScript types and package exports validate in clean
      # consumer projects ... Nothing has yet installed the package into a scratch
      # project and imported it, which is what this gate actually asks for." This
      # job is that gate: it packs all eight packages, installs the tarballs into a
      # project outside the workspace, and exercises them the way a consumer would.
      - name: Consumer fixture
        run: pnpm run test:consumer

  registry:
    name: registry payload and remote path
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The payload is build output (ADR-007), and the CLI is a bin the tests run.
      - run: pnpm run build

      # ADR-007: the registry is static versioned JSON, not a live endpoint. These
      # tests serve the published payload over HTTP and drive the CLI against it,
      # so the remote path is exercised rather than assumed.
      #
      # ADR-006: the docs source is the registry, so the same suite asserts that a
      # prop rename reaches the generated reference — a hand-edited page fails.
      - name: Registry and docs-source tests
        run: pnpm run test:registry

  audit:
    name: dependency license and security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # plan.md section 17: "Dependency licenses and security scans are reviewed."
      # A denied license (strong copyleft) fails here. A license needing review is
      # reported, not failed, because it needs a person to read it rather than a
      # string match to allow it.
      - name: License audit
        run: pnpm run audit:licenses

      # The scan's reach classification is what the report rests on, and it cannot
      # be checked against the live tree when the tree is clean: every advisory
      # would look correctly `dev` even if the classifier reported everything as
      # `dev`. The tests feed synthetic dependency paths so a transitive advisory
      # under a published package is exercised even when none exists.
      - name: Security classifier tests
        run: pnpm run test:security

      # The scan reads `pnpm audit`'s own dependency paths, and a workspace
      # package's reach is derived from its published manifest and built output —
      # so a cold checkout with no `dist/` classifies `ajv` as unowned and the
      # reach test fails before a single advisory is examined. Build first.
      - name: Build (the reach test reads published output)
        run: pnpm exec turbo run build --filter=@santaka-ui/core

      - name: Security scan
        run: pnpm run audit:security
